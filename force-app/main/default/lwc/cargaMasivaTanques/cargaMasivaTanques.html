<template>
    <!-- 🚀 Barra de progreso -->
    <div class="progreso-container">
        <lightning-progress-indicator current-step={pasoActual} type="base" has-error="false">
            <lightning-progress-step label="Tipo" value="1"></lightning-progress-step>
            <lightning-progress-step label="Archivo" value="2"></lightning-progress-step>
            <lightning-progress-step label="Confirmar" value="3"></lightning-progress-step>
        </lightning-progress-indicator>
    </div>

    <!-- 🎯 Título principal -->
    <div class="titulo-principal">
        ¿Qué deseas realizar?
    </div>
    
    <lightning-card title="Carga Masiva de Tanques" icon-name="custom:custom63">

        <!-- Paso 1: Elegir Nuevo o Existente -->
        <div class="slds-m-bottom_medium">
            <lightning-radio-group
                label="¿Qué querés hacer?"
                options={opcionesTipo}
                value={modoSeleccionado}
                onchange={handleModoChange}
                type="button">
            </lightning-radio-group>
        </div>

        <!-- Paso 2A: Crear nuevo tipo -->
        <template if:true={mostrarNuevoTipo}>
            <div class="slds-box slds-theme_default slds-m-bottom_medium">
                <lightning-input label="Marca" value={nuevaMarca} onchange={handleInputChange}></lightning-input>
                <lightning-input label="Capacidad (L)" type="number" value={nuevaCapacidad} onchange={handleInputChange}></lightning-input>
                <lightning-input label="Precio de Lista" type="number" value={nuevoPrecio} onchange={handleInputChange}></lightning-input>

                <lightning-button
                    label="Confirmar nuevo tipo"
                    variant="brand"
                    class="slds-m-top_medium"
                    onclick={crearTipo}>
                </lightning-button>
            </div>
        </template>

        <!-- Paso 2B: Usar tipo existente -->
        <template if:true={mostrarTipoExistente}>
            <div class="slds-box slds-theme_default slds-m-bottom_medium">
                <lightning-combobox
                    label="Seleccionar Tipo de Tanque"
                    value={selectedTipoId}
                    placeholder="Selecciona uno existente"
                    options={tipoOptions}
                    onchange={handleTipoChange}>
                </lightning-combobox>
            </div>
        </template>

        <!-- Paso 3: Subida de CSV -->
        <template if:true={tipoConfirmado}>
            <div class="slds-box slds-theme_default">
                <lightning-input
                    type="file"
                    label="Archivo CSV de Tanques"
                    accept=".csv"
                    onchange={handleFileUpload}>
                </lightning-input>

                <template if:true={csvCargado}>
                    <lightning-datatable
                        key-field="id"
                        data={tanquesParseados}
                        columns={columnas}
                        hide-checkbox-column="true"
                        class="slds-m-top_medium">
                    </lightning-datatable>

                    <lightning-button
                        label="Confirmar carga de tanques"
                        variant="brand"
                        class="slds-m-top_medium"
                        onclick={confirmarCarga}>
                    </lightning-button>
                </template>
            </div>
        </template>
    </lightning-card>
    <!-- ✅ MODAL DE CONFIRMACIÓN -->

<template if:true={mostrarModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 class="slds-modal__title">Carga Exitosa</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <p>✔️ ¡Tanques cargados correctamente!</p>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button variant="brand" label="Cerrar" onclick={cerrarModal}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>



</template>
